[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "struggler"
version = "0.1.0"
description = "API-first, deterministic rules engine for Twilight Struggle."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
llm-anthropic = ["anthropic>=0.68"]
llm-openai = ["openai>=1.0"]
llm = ["anthropic>=0.68", "openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
struggler = ["data/*.json"]
# The LLM bot's card playbook is strategy, not engine data, so it ships
# alongside the player that reads it rather than under data/ (see
# bots/llm/card_playbook.py).
"struggler.bots.llm" = ["*.json"]
