[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "struggler"
version = "1.0.0"
description = "Rules engine for Twilight Struggle."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
llm-anthropic = ["anthropic>=0.68"]
llm-openai = ["openai>=1.0"]
llm = ["anthropic>=0.68", "openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
struggler = ["data/*.json"]
"struggler.bots.llm" = ["*.json"]
